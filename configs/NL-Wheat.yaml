schema_version: 1

experiment:
  name: NL-Wheat
  seed: 0
  train_years: [1991, 1993, 1995, 1997, 1999, 2001, 2003, 2005, 2007, 2009, 2011, 2013, 2015, 2017, 2019, 2021]
  test_years: [1990, 1992, 1994, 1996, 1998, 2000, 2002, 2004, 2006, 2008, 2010, 2012, 2014, 2016, 2018, 2020]
  train_locations:
    - {code: NL-1, lat: 52.0, lon: 5.5}
    - {code: NL-2, lat: 51.5, lon: 5.0}
    - {code: NL-3, lat: 52.5, lon: 6.0}
  test_locations:
    - {code: NL-1, lat: 52.0, lon: 5.5}
    - {code: FR-1, lat: 48.0, lon: 0.0}

run:
  dry_run: false
  log_dir: tensorboard_logs/WOFOST_experiments

environment:
  class: WinterWheat
  framework: sb3
  timestep: 7
  random_init: false
  preserve_site_n: false
  no_weather: false
  normalize: false

observation:
  crop_features: [DVS, TAGP, LAI, NuptakeTotal, TRA, NO3, NH4, WC, RFTRA, WSO, NLOSSCUM, RNO3DEPOSTT, RNH4DEPOSTT, NamountSO, week, Naction]
  weather_features: [IRRAD, TMIN, RAIN]
  action_features: [action_history]
  partial:
    enabled: false
    features: []
    noisy_measure: false
    mask_binary: false
    placeholder: -1.11
    cost_measure: real
    measure_cost_multiplier: 1
    measure_all: false

action_space:
  type: discrete
  n: 9
  multiplier: 1.0
  discrete_amounts: null

reward:
  name: DEF
  costs_nitrogen: 10.0
  reward_var: null

constraints:
  hard:
    enabled: true
    action_limit: 0
    n_budget: 0
    temporal: false
    fertilize_until_dvs: 1.0
  soft:
    enabled_for_agents: [LagPPO, RecurrentLagPPO, RecurrentCUP, RecurrentFOCOPS]
    cost_key: cost
    components_key: cost_components
    max_non_zero_actions: 4
    fertilize_until_dvs: 1.0
    nue_threshold: [0.5, 0.9]
    n_surplus_threshold: [0.0, 40.0]
    weights: {n: 5.0, dvs: 1.0, nue: 1.0, n_surplus: 1.0}

crop_model:
  pcse_model: wofost_snomin
  model_config: pcse_gym/envs/configs/Wofost81_NWLP_MLWB_SNOMIN.conf
  agro:
    path: pcse_gym/envs/configs/agro/wheat_cropcalendar.yaml
    start_type: sowing
    campaign_start: previous_october
    preserve_dates: false
    remove_timed_n: false

crop:
  provider: yaml_crop_data
  fpath: pcse_gym/envs/configs/crop
  name: winterwheat
  variety: Arminda
  force_reload: true

soil:
  provider: yaml
  path: pcse_gym/envs/configs/soil/arminda_soil.yaml

site:
  provider: yaml
  path: pcse_gym/envs/configs/site/arminda_site.yaml
  initializer: parameter_provider_sitedata

weather:
  source: provider
  provider: auto
  random_weather: false
  file: null
  openmeteo:
    timezone: UTC
    model: best_match
    start_date: null
    forecast: false
    force_update: false

agent:
  name: PPO
  seed: ${experiment.seed}
  device: cpu
  gamma: 1.0
  policy: auto
  hyperparameters:
    batch_size: 276
    n_steps: 2208
    learning_rate: 0.001
    ent_coef: 0.01
    clip_range: 0.2
    n_epochs: 10
    gae_lambda: 0.95
    max_grad_norm: 0.5
    vf_coef: 0.5
  lagrangian:
    cost_limit: 0.0
    lambda_init: 1.0
    lambda_lr: 0.05
    lambda_max: null
    cost_vf_coef: 0.7
  policy_kwargs:
    net_arch: {pi: [256, 256], vf: [256, 256]}
    activation_fn: Tanh
    ortho_init: false
    masked_actor_critic_max_actions: 0
    apply_masking: true

wrappers:
  monitor: true
  vec_env:
    type: vec_normalize
    multiprocess: false
    n_envs: 4
    norm_obs: true
    norm_reward: true
    clip_obs: 10000000.0
    clip_reward: 100000.0
    gamma: 1.0

training:
  total_timesteps: 400000
  eval_freq: 20000
  tb_log_name_suffix: run
  intrinsic_reward:
    enabled: false
    name: null
    latent_dim: null
    beta: 1.0
    kappa: 0.0
    gamma: null
    ridge: 0.1
    lr: 0.001
    batch_size: 256
    update_proportion: 1.0
    obs_norm_type: none
    rwd_norm_type: rms
    hidden_dim: 256

logging:
  comet:
    enabled: true
    api_key_file: comet/comet_key
    workspace: pcse-gym
    project_name: cropGym_nue_paper_experiments
    log_code: true
    log_graph: true
    auto_metric_logging: true
    auto_histogram_tensorboard_logging: true
    tags: [sb3, wheat, WOFOST-SNOMIN]
